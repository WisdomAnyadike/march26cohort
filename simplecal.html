    function calculate(symbol) {
        let finalAns

        if (symbol === '+') {
            finalAns = +inputElement1.value + +inputElement2.value
        } else if (symbol === '-') {
            finalAns = +inputElement1.value - +inputElement2.value
        } else if (symbol === '/') {
            finalAns = +inputElement1.value / +inputElement2.value
        } else if (symbol === '*') {
            finalAns = +inputElement1.value * +inputElement2.value
        } else if (symbol === '%') {
            finalAns = +inputElement1.value % +inputElement2.value
        } else {
            finalAns = (+inputElement1.value) ** +inputElement2.value
        }

        outputElement.innerHTML = finalAns
        console.log(finalAns);
        inputElement1.value = ""
        inputElement2.value = ""
