<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #forPictures{
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
    </style>
</head>
<body>
    <div id="forPicturesDiv">


    </div>
<input type="file"  onchange="addPictureToScreen(event)">
    
</body>
</html>
<script>

    let allPictures = []

    function displayAllPictures(params) {
        forPicturesDiv.innerHTML = ''
        allPictures.forEach((picture, i )=> {
   forPicturesDiv.innerHTML += `<img src=${picture} width="100" height="100" style="margin:10px;">`

        })
    }



function addPictureToScreen(e) {
    let file = e.target.files[0]
    if(!file){
        alert('please attach a file')
        return
    }

    let reader = new FileReader()
    reader.readAsDataURL(file)
    reader.addEventListener('load' , (ev)=> {
      allPictures.push(ev.target.result)
displayAllPictures()

    })
    
}





</script>
