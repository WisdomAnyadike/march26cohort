<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        td,th,thead,tbody,th,tr {
            border-collapse: collapse;
            border: 1px solid black;
            padding: 10px;

        }
    </style>
</head>
<body>

    <select name="" id="PROVIDER">
        <option value=""> Choose Provider </option>
        <option value="airtel"> airtel </option>
         <option value="mtn"> mtn </option>
          <option value="glo"> glo </option>
           <option value="9mobile"> 9mobile </option>
    </select>


      <select name="" id="AMOUNT">
        <option value=""> Choose Amount </option>
        <option value="1000"> 1000</option>
         <option value="500"> 500</option>
          <option value="200">200</option>
           <option value="100">100</option>
    </select>


    <button onclick="generate()"> generate pin </button>

    <p>pin: <span id="forPin"> </span></p>

    <input value="*311*#" type="text" id="inputCard"> <button onclick="loadCard()"> load </button>


    <p> balance :<span id="forBalance"></span></p>

    <table>
       <thead>
        <th> s/n</th>
         <th> pin </th>
          <th> amount </th>
           <th> provider</th>
           <th> recharged </th>

       </thead>
       <tbody id="tbody">
 

       </tbody>

    </table>

    
</body>
</html>
<script>
let cards = JSON.parse(localStorage.getItem('cardDatabase')) || []
let provider = document.getElementById('PROVIDER')
 let amount = document.getElementById('AMOUNT')
 let balance =  +(localStorage.getItem('mybalance')) || 0
    

function displayBal() {
     forBalance.innerHTML = balance
}
    displayBal()

    function generate() {
        if (!PROVIDER.value || !AMOUNT.value) {
             alert('all fields are mandatory')
        } else {
            let pin = ''
           for (let index = 0; index < 12; index++) {
             let randomNum = Math.floor(Math.random() * 10)
             pin = pin + randomNum
           }

        forPin.innerHTML = pin

        let cardObj = {
            provider :  PROVIDER.value  , 
            amount : AMOUNT.value , 
            pin : pin  ,
            isUsed : false
        }

        cards.push(cardObj)
        localStorage.setItem('cardDatabase' , JSON.stringify(cards))
        console.log(cards);
        displayCards()
        

        }
     
    }

    

     function displayCards(params) {
          tbody.innerHTML = ''
        cards.reverse().forEach((card , index )=> {
          tbody.innerHTML +=  `<tr>
                  <td> ${index + 1} </td>
                    <td> ${card.pin} </td>
                          <td> ${card.amount} </td>
                          <td> ${card.provider} </td>
                           <td> ${card.isUsed ? 'Yes' : 'No'} </td>
      </tr>`  

        })

     }


     displayCards()

// all numbers positive or negative are truthy except 0

    // if (null) {
    //     console.log('hey class');
        
    // }


    function loadCard(params) {
        let supposedPin = inputCard.value.slice(5, 17)
        let foundCard = cards.find(( card , i , arr)=> { return card.pin === supposedPin })


        if (inputCard.value.trim() === '') {
            alert('please input card details')
        } else if (!inputCard.value.startsWith("*311*") || !inputCard.value.endsWith("#") || inputCard.value.length !== 18 || isNaN(supposedPin)) {

            alert('Invalid Format')
        }else if ( !foundCard){
         alert('Invalid Card')
        } else if ( foundCard.isUsed === true ) {
             alert('this card has already been used ')
        } else {
            balance += +foundCard.amount
            localStorage.setItem('mybalance' , balance)
           displayBal()
            alert(`you have successfully recharged ${foundCard.provider} of ${foundCard.amount}`)
            foundCard.isUsed = true
               localStorage.setItem('cardDatabase' , JSON.stringify(cards))
               displayCards()

        }
      
    }

    // isNaN('456')

    // typeof('456')

</script>
