function editTodo(i) {
    // alert(`you clicked on edit for index ${i}`)
  let promptValue =  prompt('Enter your edit value' , todoDatabase[i])
  if (promptValue === null || promptValue.trim() === '') {
    alert('enter value you want to edit')
  } else if ( promptValue.trim() ===  todoDatabase[i]){
     alert('you cant edit with the same value')
  } else {

    // todoDatabase.splice( i , 1 , promptValue.trim())
    todoDatabase[i] = promptValue.trim()
    console.log(todoDatabase);
     displayTodos()


  }


}


function displayTodos(params) {
       preview.innerHTML = ''
        for (let index = 0; index < todoDatabase.length ; index++) {
        
          preview.innerHTML +=  `<p> ${todoDatabase[index]} <button onclick="editTodo(${index})"> edit </button>  <button onclick="deleteTodo(${index})"> delete </button>  </p>`
            
        }
    
}

let canDelete = confirm('are you sure?')

   todoDatabase.splice(i , 1)
