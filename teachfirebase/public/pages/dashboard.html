<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — ChatFlow</title>
    <link rel="stylesheet" href="../css/style.css">
        <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-database-compat.js"></script>
  </head>
  <body>
    <!-- Top navigation bar (dashboard style) -->
    <nav class="navbar dashboard-nav">
      <div class="nav-container">
        <a href="./index.html" class="brand">ChatFlow</a>
        <div class="nav-links">
          <span class="welcome-tag"> Loading...</span>
          <button type="button" class="nav-link" onclick="signUserOut()">Sign out</button>
        </div>
      </div>
    </nav>

    <main class="dashboard-main">
      <div class="dashboard-container">
        <!-- Welcome message -->
        <div class="welcome-section">
          <h1 class="welcome-heading"> Loading... </h1>
          <p class="welcome-sub">
            You have 3 unread messages — stay connected.
          </p>
        </div>

        <!-- JavaScript group chat -->
        <div class="card group-chat-card">
          <div class="group-chat-header">
            <div class="group-chat-avatar">JS</div>
            <div class="group-chat-meta">
              <h2 class="group-chat-title">JavaScript Group Chat</h2>
              <span class="group-chat-sub">12 members · 4 online</span>
            </div>
            <span class="group-chat-status">● Live</span>
          </div>

          <div class="group-chat-feed">
            

            <!-- <div class="group-message">
              <div class="group-msg-avatar">H</div>
              <div class="group-msg-body">
                <p class="group-msg-meta"><span class="group-msg-name">Hamid</span> · 9:06 AM</p>
                <p class="group-msg-bubble">Quick tip: <code>onAuthStateChanged</code> fires async — make sure your UI waits for it before rendering protected routes.</p>
              </div>
            </div> -->

            

            
          </div>

          <form class="group-chat-composer" onsubmit="event.preventDefault()">
            <input
              type="text"
              class="group-chat-input"
              placeholder="Message JavaScript Group Chat…"
              aria-label="Message"
            />
            <button type="button" class="group-chat-send" onclick="sendMessage()">Send</button>
          </form>
        </div>

        <!-- extra static placeholder to fill dashboard -->
        <div class="status-note">
          <p>
            ⚡ Your chats are end-to-end encrypted ·
            <a href="./index.html" class="text-link">Back to homepage</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="footer dashboard-footer">
      <div class="footer-container">
        <p class="copyright">© 2025 ChatFlow — stay in the loop.</p>
      </div>
    </footer>
  </body>
</html>
<script src="../js/dashboard.js"></script>
